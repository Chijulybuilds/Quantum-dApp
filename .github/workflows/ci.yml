name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install script dependencies
        run: npm ci

      - name: Format
        run: forge fmt --check

      - name: Lint
        run: forge lint --deny warnings

      - name: Build (with contract sizes)
        run: forge build --sizes

      - name: Unit, fuzz and invariant tests
        run: FOUNDRY_PROFILE=ci forge test -vv

      - name: Differential tests against QoreSign (FFI)
        run: FOUNDRY_PROFILE=ffi forge test -vv

      - name: Gas snapshot is up to date
        run: forge snapshot --check --no-match-path 'test/invariant/*'

      - name: Typecheck scripts
        run: npx tsc --noEmit

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests (real ML-DSA-87 signatures)
        run: npm test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build

  vercel:
    # The same install and build Vercel runs (vercel.json): static app + bundled /api function.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            app/package-lock.json
      - run: npm --prefix server ci && npm --prefix app ci
      - run: node scripts/vercel-build.mjs
      - name: Check the build output
        run: test -f .vercel/output/config.json && test -f .vercel/output/static/index.html && test -f .vercel/output/functions/api.func/index.mjs
